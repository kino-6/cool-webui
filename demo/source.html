<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-source</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<script src="../dist/cw-source.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 220px 1fr; gap: 24px; padding: 48px; height: 100%; box-sizing: border-box; }
  .wide { grid-column: span 2; }
  #other { position: fixed; inset: auto 8px 8px auto; width: 240px; height: 135px; }
  #other cw-stat { position: absolute; inset: 16px; width: auto; height: auto; }
  cw-stage[data-link='down']::after { content: ''; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="p50"><cw-stat id="p50" class="lat" unit="ms" value="0"></cw-stat></cw-panel>
    <cw-panel label="p95"><cw-stat id="p95" class="lat" unit="ms" value="0"></cw-stat></cw-panel>
    <cw-panel label="ボット"><cw-status id="bot" state="unknown"></cw-status></cw-panel>
    <cw-panel label="ログ" class="wide"><cw-log id="log" lines="8"></cw-log></cw-panel>
    <cw-panel label="応答時間"><cw-chart id="chart" series="p50" points="20"></cw-chart></cw-panel>
  </div>
  <div hidden><cw-bars id="bars"></cw-bars><cw-feed id="feed"></cw-feed><cw-ticker id="tick"></cw-ticker></div>
  <cw-source id="src" kind="message"></cw-source>
</cw-stage>
<cw-stage id="other"><cw-stat id="p50" value="5"></cw-stat></cw-stage>
<script>
  // hand demo: post a notice every second
  if (!new URLSearchParams(location.search).has('still')) {
    let i = 0;
    setInterval(() => {
      i++;
      const v = 100 + Math.round(40 * Math.sin(i / 3));
      postMessage([{ id: i, to: '#p50', op: 'set', value: v }, { to: '#p95', op: 'set', value: v * 2 }, { to: '#chart', op: 'push', value: { p50: v } },
        { to: '#log', op: 'push', value: { time: new Date().toLocaleTimeString('ja-JP'), level: 'info', type: 'TICK', text: 'p50=' + v } },
        { to: '#bot', op: 'set', value: 'online' }], '*');
    }, 1000);
  }
</script>
</body>
</html>
