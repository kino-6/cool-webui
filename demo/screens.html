<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-screens</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 240px; gap: 24px; padding: 48px; }
  nav { position: absolute; left: 48px; bottom: 32px; display: flex; gap: 12px; z-index: 20; }
  nav button { font: 500 16px var(--cw-font); color: var(--cw-text); background: var(--cw-surface); border: var(--cw-border); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  nav button[aria-current='true'] { background: var(--cw-surface-on); color: var(--cw-text-on); }
</style>
<body>
<cw-stage id="board">
  <cw-screens id="sc" keys>
    <cw-screen name="home">
      <div class="grid">
        <cw-panel label="居間"><cw-stat value="22.4" digits="1" unit="°C"></cw-stat></cw-panel>
        <cw-panel label="台所" on><cw-stat value="80" unit="%"></cw-stat></cw-panel>
        <cw-panel label="寝室"><cw-stat value="19.8" digits="1" unit="°C"></cw-stat></cw-panel>
      </div>
    </cw-screen>
    <cw-screen name="energy">
      <div class="grid">
        <cw-panel label="消費電力"><cw-stat value="482" unit="W"></cw-stat></cw-panel>
        <cw-panel label="太陽光"><cw-stat value="1.2" digits="1" unit="kW"></cw-stat></cw-panel>
        <cw-panel label="電池"><cw-stat value="76" unit="%"></cw-stat></cw-panel>
      </div>
    </cw-screen>
  </cw-screens>
  <nav><button data-to="home">1 ホーム</button><button data-to="energy">2 エネルギー</button></nav>
</cw-stage>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('motion')) document.querySelector('#board').setAttribute('motion', q.get('motion'));
  const sc = document.querySelector('#sc');
  const mark = () => document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.to === sc.current)));
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => sc.show(b.dataset.to)));
  sc.addEventListener('cw-screen-change', mark);
  sc.updateComplete.then(mark);
</script>
</body>
</html>
