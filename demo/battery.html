<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-battery</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr 180px; gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 300px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="電池" sublabel="家じゅう"><cw-battery id="home"></cw-battery></cw-panel>
    <cw-panel label="多いとき"><cw-battery id="many" max="4" low="30"></cw-battery></cw-panel>
    <cw-panel label="狭い枠"><cw-battery id="narrow"></cw-battery></cw-panel>
    <cw-panel label="何もない"><cw-battery id="none"></cw-battery></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  const home = [
    { name: '玄関の人感センサー', level: 64 }, { name: '寝室の温度計', level: 12 }, { name: '窓の開閉センサー', level: 38 },
    { name: 'スマホ', level: 81, charging: true }, { name: '庭の水やり', level: 'unavailable' }, { name: '浴室の水漏れ', low: true },
    { name: 'ドアの鍵', level: 19.6 },
  ];
  document.getElementById('home').items = home;
  document.getElementById('many').items = Array.from({ length: 9 }, (_, i) => ({ name: `センサー ${i + 1}`, level: [92, 15, 44, 27, 70, 5, 58, 33, 100][i] }));
  document.getElementById('narrow').items = home.slice(0, 4);
</script>
</body>
</html>
