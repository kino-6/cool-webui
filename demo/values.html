<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-stat / cw-status / cw-clock</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 300px 220px 160px; gap: 24px; padding: 48px; height: 100%; box-sizing: border-box; }
  .wide { grid-column: span 2; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  #loose { position: fixed; left: 16px; bottom: 16px; width: 220px; height: 70px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="いまの時刻"><cw-clock id="tokyo" timezone="Asia/Tokyo"></cw-clock></cw-panel>
    <cw-panel label="協定世界時（UTC）"><cw-clock id="utc" timezone="UTC" format="hms"></cw-clock></cw-panel>
    <cw-panel label="居間"><cw-stat id="temp" label="室温" unit="°C" digits="1" value="22.4" warn-above="28" warn-below="12"></cw-stat></cw-panel>
    <cw-panel label="消費電力" sublabel="家全体" class="wide"><cw-stat id="power" unit="W" value="482"></cw-stat></cw-panel>
    <cw-panel label="寝室"><cw-stat id="hum" label="湿度" unit="%" value="48" motion="full"></cw-stat></cw-panel>
    <cw-panel label="家の状態" class="wide">
      <div class="list">
        <cw-status id="door" label="玄関の鍵" state="online"></cw-status>
        <cw-status id="wash" label="洗濯機" state="standby" since="1730000000000"></cw-status>
        <cw-status label="庭のカメラ" state="offline"></cw-status>
      </div>
    </cw-panel>
  </div>
</cw-stage>
<cw-stat id="loose" motion="full" unit="kWh" digits="1" value="12.8"></cw-stat>
<cw-stat id="empty" value="" style="display:none"></cw-stat>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  document.querySelector('#door').since = Date.now() - 3 * 3600e3;
</script>
</body>
</html>
