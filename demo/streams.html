<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-log / cw-feed / cw-ticker</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 90px; gap: 24px; padding: 48px; height: 100%; box-sizing: border-box; }
  .wide { grid-column: span 2; }
  #ticker-calm { position: fixed; left: 16px; bottom: 8px; width: 400px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="家の出来事"><cw-log id="log" lines="5"></cw-log></cw-panel>
    <cw-panel label="家族の連絡"><cw-feed id="feed" items="3" live="polite"></cw-feed></cw-panel>
    <cw-panel class="wide"><cw-ticker id="ticker" motion="full" speed="120"></cw-ticker></cw-panel>
  </div>
</cw-stage>
<cw-ticker id="ticker-calm"></cw-ticker>
<script>
  const q = new URLSearchParams(location.search);
  document.querySelector('#board').setAttribute('motion', q.get('motion') || 'full');
  const log = document.querySelector('#log');
  [['19:02', 'info', '照明', '居間 80% に変更'], ['19:05', 'info', '在宅', 'ハル が帰宅'], ['19:11', 'warn', '窓', '寝室の窓が 20 分開いている'], ['19:14', 'info', '家電', '洗濯が終わった'], ['19:20', 'error', 'カメラ', '庭のカメラが応答しない']]
    .forEach(([time, level, type, text]) => log.push({ time, level, type, text }));
  const feed = document.querySelector('#feed');
  [['アオイ', '牛乳買って帰ります', '18:40'], ['ハル', '駅に着いた', '19:03'], ['アオイ', '先にご飯食べてて', '19:15']].forEach(([who, text, time]) => feed.push({ who, text, time }));
  document.querySelector('#ticker').push(['電力 482 W', '太陽光 1.2 kW', '電池 76 %', '外気 14.2 °C', '次のごみの日: 明日 燃えるごみ']);
</script>
</body>
</html>
