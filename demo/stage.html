<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-stage</title>
<script>window.pauseLog = []; document.addEventListener('cw-pause', (e) => pauseLog.push(e.target.id));</script>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  /* stripes behind the small stages, so bg="none" visibly shows the page */
  body { background: repeating-linear-gradient(45deg, #2a2a2a 0 12px, #3a3a3a 12px 24px); }
  #main { height: 72vh; }
  .row { display: flex; gap: 16px; padding: 16px; height: calc(28vh - 32px); }
  .row cw-stage { flex: 1; min-height: 0; }
  .card { position: absolute; background: var(--cw-surface); border: var(--cw-border); border-radius: var(--cw-radius);
          backdrop-filter: var(--cw-blur); padding: 24px; font-size: 28px; }
  .fill { position: absolute; inset: 40px; background: var(--cw-ground); border-radius: 12px; }
</style>
<body>
<cw-stage id="main">
  <div class="card" style="left:48px;top:48px;width:520px;height:220px">1600 × 900 の舞台</div>
  <div class="card" style="right:48px;bottom:48px;width:520px;height:220px;color:var(--cw-signal)">右下の端</div>
</cw-stage>
<div class="row">
  <cw-stage id="full" motion="full" controls="none"><div class="card" style="inset:200px">motion=full</div></cw-stage>
  <cw-stage id="still" motion="off" bg="none"><div class="fill"></div><div class="card" style="inset:200px">bg=none</div></cw-stage>
  <cw-stage id="plain" bg="plain" base="1920x1080"><div class="card" style="inset:200px">bg=plain 1920×1080</div></cw-stage>
  <cw-stage id="held" paused><div class="card" style="inset:200px">paused</div></cw-stage>
</div>
</body>
</html>
