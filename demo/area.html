<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-area</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr) 190px; gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 170px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel><cw-area id="living" label="居間"></cw-area></cw-panel>
    <cw-panel><cw-area id="bed" label="寝室"></cw-area></cw-panel>
    <cw-panel><cw-area id="hall" label="廊下"></cw-area></cw-panel>
    <cw-panel><cw-area id="narrow" label="書斎"></cw-area></cw-panel>
    <cw-panel><cw-area id="none" label="物置"></cw-area></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  document.getElementById('living').now = { temperature: 22.4, humidity: 48, lightsOn: 2, lights: 3, motion: true };
  document.getElementById('bed').now = { temperature: 19.8, humidity: 55, lightsOn: 0, lights: 2, motion: false };
  document.getElementById('hall').now = { temperature: -1.5, lights: 1, lightsOn: 1 };
  document.getElementById('narrow').now = { temperature: 23.1, humidity: 40, lightsOn: 1, lights: 1, motion: true };
  const all = ['living', 'bed', 'hall', 'narrow'];
  for (const id of all) document.getElementById(id).addEventListener('cw-lights', (e) => console.log(id, e.detail.on));
</script>
</body>
</html>
