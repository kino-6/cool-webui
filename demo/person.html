<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-person</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 200px; gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 260px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="家族"><cw-person id="family"></cw-person></cw-panel>
    <cw-panel label="誰もいない"><cw-person id="none"></cw-person></cw-panel>
    <cw-panel label="狭い枠"><cw-person id="narrow"></cw-person></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  const now = Date.now();
  const family = [
    { name: 'ハル', place: 'not_home', since: now - 3 * 3600e3 - 5 * 60e3 },
    { name: 'アオイ', place: 'home', since: new Date(now - 25 * 60e3).toISOString(), picture: 'img/cover.svg' },
    { name: 'ソラ', place: '学校', since: now - 26 * 3600e3 },
    { name: 'リク', place: 'home', since: now - 20e3 },
  ];
  document.getElementById('family').people = family;
  document.getElementById('narrow').people = family;
</script>
</body>
</html>
