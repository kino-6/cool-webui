<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-timer</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 170px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="家事"><cw-timer id="wash" label="洗濯機"></cw-timer></cw-panel>
    <cw-panel label="台所"><cw-timer id="oven" label="オーブン"></cw-timer></cw-panel>
    <cw-panel label="止めてある"><cw-timer id="tea" label="お茶"></cw-timer></cw-panel>
    <cw-panel label="待機"><cw-timer id="idle" label="食洗機"></cw-timer></cw-panel>
    <cw-panel label="終わった"><cw-timer id="done" label="炊飯器"></cw-timer></cw-panel>
    <cw-panel label="取得できない"><cw-timer id="none"></cw-timer></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  const now = Date.now();
  document.getElementById('wash').now = { state: 'active', end: now + (1 * 3600 + 12 * 60 + 5) * 1000, duration: 2 * 3600 };
  document.getElementById('oven').now = { state: 'active', end: new Date(now + 3000).toISOString(), duration: 600 };
  document.getElementById('tea').now = { state: 'paused', remaining: 95, duration: 180 };
  document.getElementById('idle').now = { state: 'idle', duration: 5400 };
  document.getElementById('done').now = { state: 'done', duration: 3600 };
</script>
</body>
</html>
