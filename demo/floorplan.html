<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-floorplan</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  cw-panel { position: absolute; inset: 60px 200px; width: auto; height: auto; }
  #alone { position: fixed; right: 12px; bottom: 12px; width: 240px; height: 160px; outline: 1px solid #333; }
</style>
<body>
<cw-stage id="stage">
  <cw-panel label="家のようす"><cw-floorplan id="plan" focus="living"></cw-floorplan></cw-panel>
</cw-stage>
<cw-floorplan id="alone" motion="full" focus="a"></cw-floorplan>
<script>
  const q = new URLSearchParams(location.search);
  const stage = document.getElementById('stage');
  stage.setAttribute('motion', q.get('motion') || 'calm');
  const rooms = [
    { id: 'living', name: 'リビング', x: 0, y: 0, w: 6, h: 4.5, on: true, color: 'hsl(36 90% 62%)', level: 0.85, note: '22.4°' },
    { id: 'kitchen', name: 'キッチン', x: 6, y: 0, w: 3, h: 4.5, on: true, color: 'hsl(48 90% 62%)', level: 0.6, note: '23.1°' },
    { id: 'study', name: '書斎', x: 9, y: 0, w: 3, h: 4.5, on: false, color: 'hsl(205 90% 62%)', level: 0.7, note: '21.0°' },
    { id: 'bedroom', name: '寝室', x: 0, y: 4.5, w: 5, h: 3.5, on: true, color: 'hsl(275 90% 62%)', level: 0.35, note: '20.6°' },
    { id: 'bath', name: '浴室', x: 5, y: 4.5, w: 3, h: 3.5, on: false, color: 'hsl(190 90% 62%)', level: 0.9, note: '24.8°' },
    { id: 'entrance', name: '玄関', x: 8, y: 4.5, w: 4, h: 3.5, on: false, color: 'hsl(30 90% 62%)', level: 0.5, note: '19.2°' },
  ];
  const plan = document.getElementById('plan');
  plan.rooms = rooms;
  plan.people = [{ name: 'アオイ', color: '#9cc9ef', room: 'living' }, { name: 'ハル', color: '#f2c38b', room: null }];
  plan.items = [{ x: .6, y: 2.6, w: 2.6, h: .9, z: .45 }, { x: 3.4, y: 1, w: 1.6, h: 1, z: .3 }, { x: 6.4, y: .3, w: 2.3, h: .7, z: .9 },
    { x: 9.4, y: .4, w: 2, h: .8, z: .75 }, { x: .6, y: 5.2, w: 2.2, h: 2.2, z: .45 }, { x: 5.4, y: 5, w: 1, h: 2.4, z: .5 }];
  plan.addEventListener('cw-room', (e) => { const r = rooms.find((x) => x.id === e.detail.id); r.on = !r.on; plan.rooms = rooms; });
  document.getElementById('alone').rooms = [{ id: 'a', name: 'A', x: 0, y: 0, w: 3, h: 2, on: true, color: '#ff7ab8' }, { id: 'b', name: 'B', x: 3, y: 0, w: 2, h: 2 }];
</script>
</body>
</html>
