<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-vacuum</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 200px; gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 240px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="掃除機"><cw-vacuum id="living" label="ルンバ"></cw-vacuum></cw-panel>
    <cw-panel label="止まっている"><cw-vacuum id="error" label="2 階"></cw-vacuum></cw-panel>
    <cw-panel label="狭い枠"><cw-vacuum id="narrow" label="1 階"></cw-vacuum></cw-panel>
    <cw-panel label="ボタンが少ない機種"><cw-vacuum id="few" label="安い掃除機"></cw-vacuum></cw-panel>
    <cw-panel label="取得できない"><cw-vacuum id="none"></cw-vacuum></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  document.getElementById('living').now = { state: 'cleaning', battery: 72, area: 23.6, duration: 18 };
  document.getElementById('error').now = { state: 'error', battery: 14, error: 'ブラシに何か絡まっています' };
  document.getElementById('narrow').now = { state: 'docked', battery: 100, area: 41, duration: 52 };
  document.getElementById('few').now = { state: 'docked', battery: 88, controls: ['start', 'return'] };
</script>
</body>
</html>
