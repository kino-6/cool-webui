<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-panel</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 180px; gap: 20px; padding: 48px; }
  .content { font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .content small { font-size: 16px; opacity: .7; margin-left: 4px; }
</style>
<body>
<cw-stage>
  <div class="grid">
    <cw-panel id="plain" label="居間" sublabel="22.4 °C"><div class="content">48<small>%</small></div></cw-panel>
    <cw-panel id="on" label="台所" sublabel="点灯" on><div class="content">80<small>%</small></div></cw-panel>
    <cw-panel id="xss" label="<img src=x onerror=alert(1)>"><div class="content">—</div></cw-panel>
    <cw-panel id="bare"><div class="content">名札なし</div></cw-panel>
    <cw-panel id="subx" label="寝室" sublabel="<b>bold</b>"><div class="content">—</div></cw-panel>
    <cw-panel id="subonly" sublabel="右だけ"><div class="content">—</div></cw-panel>
    <div id="plainparent" style="height:150px"><cw-panel id="inblock" label="普通の親"></cw-panel></div>
  </div>
</cw-stage>
</body>
</html>
