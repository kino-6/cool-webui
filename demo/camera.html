<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-camera</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px; padding: 48px; height: 100%; box-sizing: border-box; }
  #board { position: fixed; inset: 0 0 170px 0; height: auto; }
  .big { grid-row: span 2; }
  #clip { position: fixed; left: 16px; bottom: 16px; width: 240px; height: 135px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel class="big" label="防犯カメラ"><cw-camera id="garden" label="庭" src="img/garden.svg" refresh="1"></cw-camera></cw-panel>
    <cw-panel label="玄関"><cw-camera id="door" label="玄関" src="img/entrance.svg" refresh="0"></cw-camera></cw-panel>
    <cw-panel label="車庫"><cw-camera id="gone" label="車庫" src="img/missing.png"></cw-camera></cw-panel>
  </div>
</cw-stage>
<cw-camera id="clip" label="動画" src="img/missing.webm" video motion="full"></cw-camera>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
</script>
</body>
</html>
