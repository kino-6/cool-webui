<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-weather</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--cw-ground-solid); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; padding: 48px; box-sizing: border-box; align-content: start; }
  cw-panel { height: 300px; }
</style>
<body>
<cw-stage id="board">
  <div class="grid">
    <cw-panel label="天気" sublabel="東京"><cw-weather id="tokyo"></cw-weather></cw-panel>
    <cw-panel label="山の家"><cw-weather id="hill" days="3"></cw-weather></cw-panel>
    <cw-panel label="取得できない"><cw-weather id="none"></cw-weather></cw-panel>
  </div>
</cw-stage>
<script>
  const m = new URLSearchParams(location.search).get('motion');
  if (m) document.querySelector('#board').setAttribute('motion', m);
  // just after local midnight, so counting the weekday in UTC instead of local time shows up in any time zone east of UTC
  const day = (n) => new Date(2026, 10, 2 + n, 0, 30).toISOString();
  const tokyo = document.getElementById('tokyo');
  tokyo.now = { condition: 'partlycloudy', temp: 14.6, high: 18.2, low: 9.4, humidity: 58, wind: 3.24 };
  tokyo.forecast = [
    { time: day(0), condition: 'partlycloudy', high: 18, low: 9, rain: 10 }, { time: day(1), condition: 'rainy', high: 15, low: 11, rain: 80 },
    { time: day(2), condition: 'cloudy', high: 16, low: 10 }, { time: day(3), condition: 'sunny', high: 20, low: 8, rain: 0 },
    { time: day(4), condition: 'lightning-rainy', high: 17, low: 12, rain: 90 }, { time: day(5), condition: 'snowy', high: 3, low: -2 },
  ];
  const hill = document.getElementById('hill');
  hill.now = { condition: 'snowy', temp: -1.4, humidity: 82 };
  hill.forecast = [{ time: day(0), condition: 'snowy', high: 1, low: -5 }, { time: day(1), condition: 'fog', high: 2, low: -3 }, { time: day(2), condition: 'clear-night', high: 4, low: -6 }, { time: day(3), condition: 'sunny', high: 6, low: -4 }];
</script>
</body>
</html>
