<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cw-flow</title>
<script src="theme.js"></script>
<script src="../dist/cw.iife.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  cw-panel { position: absolute; inset: 60px 360px; width: auto; height: auto; }
  #alone { position: fixed; right: 12px; bottom: 12px; width: 240px; height: 160px; outline: 1px solid #333; }
</style>
<body>
<cw-stage id="stage">
  <cw-panel label="電気の流れ"><cw-flow id="flow" unit="W"></cw-flow></cw-panel>
</cw-stage>
<cw-flow id="alone" motion="full"></cw-flow>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('stage').setAttribute('motion', q.get('motion') || 'calm');
  const ICON = {
    sun: 'M12 8a4 4 0 1 0 0.01 0M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
    grid: 'M12 2l-5 20M12 2l5 20M8 9h8M6.5 15h11',
    batt: 'M5 7h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM21 11v2',
    home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  };
  const flow = document.getElementById('flow');
  flow.nodes = [
    { id: 'solar', label: '太陽光', value: 2400, x: 0.5, y: 0.2, color: 'var(--cw-warn-soft, #f0b45a)', icon: ICON.sun },
    { id: 'grid', label: '電力会社', value: 120, x: 0.17, y: 0.6, color: 'var(--cw-signal)', icon: ICON.grid },
    { id: 'batt', label: '蓄電池', value: '64', unit: '%', x: 0.83, y: 0.6, color: 'var(--cw-ok)', icon: ICON.batt },
    { id: 'home', label: '家', value: 1300, x: 0.5, y: 0.78, icon: ICON.home },
  ];
  flow.links = [
    { from: 'solar', to: 'home', value: 1180 },
    { from: 'grid', to: 'home', value: 120 },
    { from: 'batt', to: 'home', value: 0 },
    { from: 'solar', to: 'batt', value: 1220 },
  ];
  const alone = document.getElementById('alone');
  alone.nodes = [{ id: 'a', label: 'A', value: 1, x: 0.2, y: 0.5 }, { id: 'b', label: 'B', value: 1, x: 0.8, y: 0.5 }];
  alone.links = [{ from: 'a', to: 'b', value: 1 }];
</script>
</body>
</html>
